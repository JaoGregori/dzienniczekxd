name: Deploy to Wasmer
on:
  push:
    branches:
      - main  # lub master, zależy jakiej nazwy używasz

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Wasmer CLI
        run: |
          curl https://get.wasmer.io -sSfL | sh
          echo "$HOME/.wasmer/bin" >> $GITHUB_PATH

      - name: Deploy to Wasmer
        run: wasmer deploy --publish-package --non-interactive --token=${{ secrets.WASMER_TOKEN }}
